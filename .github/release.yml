# Shapes GitHub's generated release notes, which GoReleaser uses via
# changelog.use: github-native.
#
# Categories match on labels or authors. Author matching is what makes this work
# without maintaining labels: Renovate's pull requests are grouped by who opened
# them, not by a label that has to be configured first.
changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: Features
      labels:
        - feature
        - enhancement
    - title: Fixes
      labels:
        - bug
        - fix
    - title: Dependencies
      authors:
        - renovate[bot]
        - dependabot[bot]
    - title: Other Changes
      labels:
        - "*"
